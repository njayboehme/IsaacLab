_global_chunk_size: &chunk_size 3
seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: True
  policy:  # see gaussian_model parameters
    class: MLPGaussian
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    action_chunk_size: *chunk_size
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: ACTIONS
    # residual:  # see gaussian_model parameters
    #   class: MLPGaussian
    #   clip_actions: False
    #   clip_log_std: True
    #   min_log_std: -20.0
    #   max_log_std: 2.0
    #   initial_log_std: 0.0
    #   # null for no scaling, 
    #     # an int/float to use a tanh and multiply by the value, 
    #     # 'learn_vector' to learn a scaling vector after a tanh, 
    #     # 'learn_scale' to learn a scaling number for all actions after a tanh
    #   action_scale: null #null, 'learn_vector', 'learn_scale', number
    #   network:
    #     - name: net
    #       input: OBSERVATIONS
    #       layers: [64, 64]
    #       activations: elu
    #   output: ACTIONS
  value:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: ONE


# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomChunkedMemory
  memory_size: 6  # the effective size is memory_size * chunk_size
  action_chunk_size: *chunk_size


# PPO agent configuration (field names are from PPO_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: PPO_CHUNKED
  action_chunk_size: *chunk_size
  rollouts: 18 # The number of steps a residual policy will take. The chunk policy takes rollouts // action_chunk_size steps (18)
  learning_epochs: 10
  mini_batches: 2
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 1.0e-03
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.3
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.0
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.6
  time_limit_bootstrap: False
  use_all_states: True
  residual_begin_training: 360000 # THIS MUST BE MODULO 0 BY THE ROLLOUT SIZE!
  # logging and checkpoint
  experiment:
    directory: "ant_direct_chunked"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 8000
  environment_info: log


