seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: True
  policy:  # see gaussian_model parameters
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: ACTIONS
  critic_1:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: ONE
  critic_2:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: ONE
  target_critic_1:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: ONE
  target_critic_2:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: ONE
  
  


# Rollout memory
memory:
  class: RandomMemory
  memory_size: 50


# https://skrl.readthedocs.io/en/latest/api/agents/sac.html#skrl.agents.torch.sac.SAC_CFG.target_entropy
agent:
  class: SAC
  # Number of gradient steps to perform for each update
  gradient_steps: 1
  batch_size: 8192

  discount_factor: 0.99
  # float. For updating target networks
  polyak: 0.005

  learning_rate: 0.0003
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: null
  
  observation_preprocessor: null
  observation_preprocessor_kwargs: null

  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null

  random_timesteps: 0

  learning_starts: 32

  # float
  grad_norm_clip: 1.0
  # bool
  learn_entropy: True
  # float
  initial_entropy_value: 0.2
  # float (target value used for updating entropy)
  target_entropy: -8.0

  rewards_shaper: null
  # bool
  mixed_precision: False

  # logging and checkpoint
  experiment:
    directory: "ant_direct_sac"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 100000
  environment_info: log
